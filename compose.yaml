services:
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Interface web

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: izzyone
      POSTGRES_USER: izzyone
      POSTGRES_PASSWORD: izzyone
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Broker do Celery

volumes:
  postgres_data:
