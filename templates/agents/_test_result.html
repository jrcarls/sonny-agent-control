{# Resultado do botão "Testar agente", trocado no lugar pelo htmx #}
{% if error %}
    <div class="rounded-base bg-danger-soft p-4 text-sm text-fg-danger-strong" role="alert">
        <p class="font-medium">O teste falhou</p>
        <p class="mt-1 break-words">{{ error }}</p>
    </div>
{% else %}
    <div class="rounded-base bg-success-soft p-4 text-sm text-fg-success-strong" role="status">
        <p class="font-medium">{{ model }} respondeu em {{ seconds|floatformat:1 }}s</p>
        <p class="mt-1 break-words">“{{ answer|truncatechars:200 }}”</p>
    </div>
{% endif %}
