{# Botão ou link com cara de botão. variant: primary | secondary | danger. size: md | sm. Com href vira <a>. #}
<c-vars variant="primary" size="md" href="" type="button" class="" />
{% if href %}<a href="{{ href }}" {{ attrs }} class="box-border inline-flex cursor-pointer items-center justify-center rounded-base border text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 disabled:cursor-not-allowed disabled:opacity-60 {% if size == "sm" %}px-3 py-2{% else %}px-4 py-2.5{% endif %} {% if variant == "secondary" %}border-default-medium bg-neutral-secondary-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-neutral-tertiary{% elif variant == "danger" %}border-transparent bg-danger text-white hover:bg-danger-strong focus:ring-danger-medium{% else %}border-transparent bg-brand text-white hover:bg-brand-strong focus:ring-brand-medium{% endif %} {{ class }}">{{ slot }}</a>{% else %}<button type="{{ type }}" {{ attrs }} class="box-border inline-flex cursor-pointer items-center justify-center rounded-base border text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 disabled:cursor-not-allowed disabled:opacity-60 {% if size == "sm" %}px-3 py-2{% else %}px-4 py-2.5{% endif %} {% if variant == "secondary" %}border-default-medium bg-neutral-secondary-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-neutral-tertiary{% elif variant == "danger" %}border-transparent bg-danger text-white hover:bg-danger-strong focus:ring-danger-medium{% else %}border-transparent bg-brand text-white hover:bg-brand-strong focus:ring-brand-medium{% endif %} {{ class }}">{{ slot }}</button>{% endif %}
