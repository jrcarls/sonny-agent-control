{# Formulário do modal de novo projeto. Com erro de validação, o htmx troca este <form> por ele mesmo. #}
<form hx-post="{% url 'orchestrator:project_create' %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]"
      method="post" action="{% url 'orchestrator:project_create' %}" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <div class="mt-6 flex items-center gap-3">
        <button type="submit" class="box-border inline-flex items-center justify-center rounded-base border px-4 py-2.5 text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 border-transparent bg-brand text-white hover:bg-brand-strong focus:ring-brand-medium cursor-pointer disabled:opacity-60">Salvar</button>
        <button type="button" @click="close()" class="box-border inline-flex items-center justify-center rounded-base border px-4 py-2.5 text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 border-default-medium bg-neutral-secondary-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-neutral-tertiary cursor-pointer">Cancelar</button>
    </div>
</form>
