{# Formulário do modal de novo projeto. Com erro de validação, o htmx troca este <form> por ele mesmo. #}
<form hx-post="{% url 'orchestrator:project_create' %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]"
      method="post" action="{% url 'orchestrator:project_create' %}" novalidate>
    {% csrf_token %}
    <c-fields :form="form" />
    <div class="mt-6 flex items-center gap-3">
        <c-button type="submit">Salvar</c-button>
        <c-button variant="secondary" type="button" @click="close()">Cancelar</c-button>
    </div>
</form>
