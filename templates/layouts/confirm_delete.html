{% extends "layouts/app.html" %}

{% block title %}Excluir {{ object }}{% endblock %}

{% block content %}
<div class="max-w-3xl py-6">
    <h1 class="mb-2 text-2xl font-semibold tracking-tight text-heading">Excluir “{{ object }}”?</h1>
    <p class="mb-6 text-sm text-body">Essa ação não pode ser desfeita.</p>
    <form method="post" class="flex items-center gap-3">
        {% csrf_token %}
        <c-button variant="danger" type="submit">Excluir</c-button>
        <c-button variant="secondary" href="{{ cancel_url }}">Cancelar</c-button>
    </form>
</div>
{% endblock %}
