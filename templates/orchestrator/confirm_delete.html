{% extends "layouts/app.html" %}

{% block title %}Excluir {{ object }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl py-6">
    <h1 class="mb-2 text-2xl font-semibold tracking-tight text-heading">Excluir “{{ object }}”?</h1>
    <p class="mb-6 text-sm text-body">Essa ação não pode ser desfeita.</p>
    <form method="post" class="flex items-center gap-3">
        {% csrf_token %}
        <button type="submit" class="box-border inline-flex items-center justify-center rounded-base border px-4 py-2.5 text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 border-transparent bg-danger text-white hover:bg-danger-strong focus:ring-danger-medium">Excluir</button>
        <a href="{{ cancel_url }}" class="box-border inline-flex items-center justify-center rounded-base border px-4 py-2.5 text-center text-sm font-medium leading-5 shadow-xs focus:outline-none focus:ring-4 border-default-medium bg-neutral-secondary-medium text-body hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-neutral-tertiary">Cancelar</a>
    </form>
</div>
{% endblock %}
