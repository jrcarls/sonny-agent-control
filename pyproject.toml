[project]
name = "sonny-agent-control"
version = "0.1.0"
description = "Orquestrador de agentes de IA que trabalham em repositórios de código"
readme = "README.md"
authors = [
    { name = "Jean Reis", email = "jeanreis@zohomail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "django-allauth>=65.19.7",
    "django-cotton>=2.7.2",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-tabler-icons>=0.7.2",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "markdown-it-py>=4.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
# Aplicação Django, não um pacote instalável: o código roda direto da raiz do projeto
package = false

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-debug-toolbar>=8.0.0",
    "watchfiles>=1.3.0",
]
